[build]
  command = "node scripts/build-qidian-reader.js && node scripts/patch-qidian-v244.js && node scripts/patch-qidian-v245.js"
  publish = "."

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/qidian-reader/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
