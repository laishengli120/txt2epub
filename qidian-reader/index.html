<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>通用小说阅读器 V2.1 - 脚本复制页</title>
  <style>
    :root{color-scheme:light;--bg:#f5f3ee;--card:#fff;--text:#252525;--muted:#77736b;--line:#e6e1d8;--accent:#c6352b;--code:#171717}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{width:min(1180px,calc(100% - 32px));margin:34px auto 60px}
    .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
    h1{margin:0;font-size:28px}.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
    .meta{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
    .tag{padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(50,40,20,.04)}
    .bar{min-height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}
    .status{font-size:13px;color:var(--muted)}.ok{color:#25824d}.err{color:#b42318}
    textarea{display:block;width:100%;height:70vh;min-height:520px;resize:vertical;border:0;outline:0;padding:20px 22px;background:var(--code);color:#ddd;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;tab-size:4;white-space:pre}
    .tip{margin-top:15px;padding:15px 18px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:13px;line-height:1.8}
    @media(max-width:720px){.wrap{width:calc(100% - 20px);margin-top:20px}.head{align-items:flex-start;flex-direction:column}h1{font-size:22px}textarea{min-height:60vh}.bar{align-items:flex-start;flex-direction:column;padding:12px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div>
        <h1>通用小说阅读器 V2.1</h1>
        <p class="sub">起点阅读页风格 · 完整目录缓存 · 目录驱动上一章/下一章</p>
      </div>
      <div class="actions">
        <button class="btn primary" id="copyBtn" disabled>复制全部代码</button>
        <button class="btn" id="selectBtn" disabled>全选代码</button>
        <button class="btn" id="saveBtn" disabled>保存为 .user.js</button>
      </div>
    </div>

    <div class="meta">
      <span class="tag">版本 <b>2.1.0</b></span>
      <span class="tag">行数 <b id="lines">读取中</b></span>
      <span class="tag">大小 <b id="size">读取中</b></span>
      <span class="tag">Tampermonkey / Violentmonkey</span>
    </div>

    <section class="panel">
      <div class="bar">
        <strong>完整 Userscript</strong>
        <span class="status" id="status">正在读取脚本…</span>
      </div>
      <textarea id="code" spellcheck="false" readonly>正在读取脚本…</textarea>
    </section>

    <div class="tip">
      使用方法：点击“复制全部代码” → 打开 Tampermonkey → 新建脚本 → 删除默认内容 → 粘贴 → 保存。
      “保存为 .user.js”会直接由当前网页在浏览器本地生成文件，不再经过 ChatGPT 附件地址。
    </div>
  </main>

  <script>
    const codeEl=document.getElementById('code');
    const statusEl=document.getElementById('status');
    const copyBtn=document.getElementById('copyBtn');
    const selectBtn=document.getElementById('selectBtn');
    const saveBtn=document.getElementById('saveBtn');
    let scriptText='';

    async function readText(url){
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok) throw new Error(`${url}：HTTP ${res.status}`);
      return await res.text();
    }

    async function gunzipBase64(base64Text){
      let b64=base64Text
        .replace(/\s+/g,'')
        .replace(/-/g,'+')
        .replace(/_/g,'/')
        .replace(/[^A-Za-z0-9+/=]/g,'');
      b64=b64.replace(/=+$/,'');
      b64+='='.repeat((4-b64.length%4)%4);

      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);

      if(!('DecompressionStream' in window)){
        throw new Error('当前浏览器不支持 gzip 解压，请使用最新版 Chrome / Edge / Safari');
      }

      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    }

    async function loadScript(){
      try{
        statusEl.textContent='正在读取脚本数据…';

        const [prefix0,prefix1,tail]=await Promise.all([
          readText('./script-v21-prefix0.b64?v=2102'),
          readText('./script-v21-prefix1.b64?v=2102'),
          readText('./script-v21.gz.b64?v=2102')
        ]);

        const payload=prefix0.trim()+prefix1.trim()+tail.trim();
        if(payload.length!==26444){
          throw new Error(`脚本数据长度异常：${payload.length}，应为 26444`);
        }

        scriptText=await gunzipBase64(payload);

        if(!scriptText.startsWith('// ==UserScript==')){
          throw new Error('脚本校验失败：未找到 Userscript 头');
        }

        codeEl.value=scriptText;
        document.getElementById('lines').textContent=scriptText.split('\n').length.toLocaleString();
        document.getElementById('size').textContent=(new Blob([scriptText]).size/1024).toFixed(1)+' KB';
        statusEl.textContent='代码已就绪';
        statusEl.className='status ok';
        copyBtn.disabled=false;
        selectBtn.disabled=false;
        saveBtn.disabled=false;
      }catch(err){
        console.error(err);
        codeEl.value='脚本读取失败：'+err.message+'\n\n请按 Command + Shift + R 强制刷新后重试。';
        statusEl.textContent='读取失败';
        statusEl.className='status err';
      }
    }

    async function copyAll(){
      if(!scriptText)return;
      try{
        await navigator.clipboard.writeText(scriptText);
      }catch(_){
        codeEl.focus();
        codeEl.select();
        document.execCommand('copy');
      }
      copyBtn.textContent='已复制';
      statusEl.textContent='已复制，可直接粘贴到 Tampermonkey';
      setTimeout(()=>copyBtn.textContent='复制全部代码',1600);
    }

    function selectAllCode(){
      codeEl.focus();
      codeEl.select();
      statusEl.textContent='代码已全选';
    }

    function saveScript(){
      if(!scriptText)return;
      const blob=new Blob([scriptText],{type:'text/javascript;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download='universal_qidian_reader_v21.user.js';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      statusEl.textContent='已生成 .user.js 文件';
    }

    copyBtn.addEventListener('click',copyAll);
    selectBtn.addEventListener('click',selectAllCode);
    saveBtn.addEventListener('click',saveScript);
    loadScript();
  </script>
</body>
</html>
