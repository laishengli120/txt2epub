<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通用小说阅读器 V2.2</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--text:#252525;--muted:#77736b;--line:#e4ded4;--accent:#c6352b;--code:#171717}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:36px auto 60px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.top h1{margin:0;font-size:28px}.sub{margin-top:8px;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 15px;border-radius:8px;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tag{padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:12px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card)}.bar{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.status{color:var(--muted);font-size:13px}.ok{color:#25824d}.err{color:#b42318}textarea{display:block;width:100%;height:70vh;min-height:520px;resize:vertical;border:0;outline:0;padding:20px 22px;background:var(--code);color:#ddd;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre}.features{margin-top:15px;padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px;line-height:1.9}.features b{color:var(--text)}@media(max-width:720px){.wrap{width:calc(100% - 20px);margin-top:20px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:22px}.bar{align-items:flex-start;flex-direction:column;padding:12px}textarea{min-height:60vh}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><h1>通用小说阅读器 V2.2</h1><div class="sub">无刷新切章 · 下一章预加载 · 自动连续阅读 · 完整目录缓存</div></div>
    <div class="actions"><button class="btn primary" id="copy" disabled>复制全部代码</button><button class="btn" id="select" disabled>全选代码</button><button class="btn" id="save" disabled>保存 .user.js</button></div>
  </div>
  <div class="meta"><span class="tag">版本 <b>2.2.0</b></span><span class="tag">行数 <b id="lines">读取中</b></span><span class="tag">大小 <b id="size">读取中</b></span><span class="tag">Tampermonkey / Violentmonkey</span></div>
  <section class="panel"><div class="bar"><strong>完整 Userscript</strong><span class="status" id="status">正在直接读取 .user.js…</span></div><textarea id="code" readonly spellcheck="false">正在读取脚本…</textarea></section>
  <div class="features"><b>V2.2 新增：</b>点击上一章/下一章时阅读器不会关闭，而是在后台读取并替换章节；会静默预加载下一章。进入「设置」可开启“滑到底自动接下一章”，开启后接近章节底部时会把下一章正文直接追加在当前页下方，继续向下滚动即可连续阅读。地址栏会随当前阅读章节更新。</div>
</main>
<script>
const code=document.getElementById('code'),statusEl=document.getElementById('status'),copy=document.getElementById('copy'),select=document.getElementById('select'),save=document.getElementById('save');let scriptText='';
async function load(){try{const r=await fetch('./universal_qidian_reader_v2.2.user.js?v=2200',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);scriptText=await r.text();if(!scriptText.startsWith('// ==UserScript=='))throw new Error('Userscript 头校验失败');if(!scriptText.includes('// @version      2.2.0'))throw new Error('读取到的不是 V2.2.0');code.value=scriptText;document.getElementById('lines').textContent=scriptText.split('\n').length.toLocaleString();document.getElementById('size').textContent=(new Blob([scriptText]).size/1024).toFixed(1)+' KB';statusEl.textContent='代码已就绪';statusEl.className='status ok';copy.disabled=select.disabled=save.disabled=false}catch(e){console.error(e);code.value='脚本读取失败：'+e.message+'\n\n请按 Command + Shift + R 强制刷新后重试。';statusEl.textContent='读取失败';statusEl.className='status err'}}
copy.onclick=async()=>{if(!scriptText)return;try{await navigator.clipboard.writeText(scriptText)}catch(_){code.focus();code.select();document.execCommand('copy')}copy.textContent='已复制';statusEl.textContent='已复制，可粘贴到 Tampermonkey';setTimeout(()=>copy.textContent='复制全部代码',1400)};
select.onclick=()=>{code.focus();code.select();statusEl.textContent='代码已全选'};
save.onclick=()=>{if(!scriptText)return;const u=URL.createObjectURL(new Blob([scriptText],{type:'text/javascript;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='universal_qidian_reader_v2.2.user.js';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)};
load();
</script>
</body>
</html>
