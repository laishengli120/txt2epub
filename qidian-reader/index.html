<style>:root{--bg:#f5f3ee;--card:#fff;--text:#252525;--muted:#77736b;--line:#e4ded4;--accent:#c6352b;--code:#171717}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:36px auto 60px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.top h1{margin:0;font-size:28px}.sub{margin-top:8px;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 15px;border-radius:8px;font-weight:600;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.tag{padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:12px}.panel{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card)}.bar{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}.status{color:var(--muted);font-size:13px}.ok{color:#25824d}.err{color:#b42318}textarea{display:block;width:100%;height:70vh;min-height:520px;resize:vertical;border:0;outline:0;padding:20px 22px;background:var(--code);color:#ddd;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre}.features{margin-top:15px;padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px;line-height:1.9}@media(max-width:720px){.wrap{width:calc(100% - 20px);margin-top:20px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:22px}textarea{min-height:60vh}}</style>

<body><main class="wrap"><div class="top"><div><h1>通用小说阅读器 V2.4.0</h1><div class="sub">Fix 2404 · 已移除 fetch / XHR，脚本数据通过普通静态 JS 文件加载</div></div><div class="actions"><button class="btn primary" id="copy" disabled>复制全部代码</button><button class="btn" id="select" disabled>全选代码</button><button class="btn" id="save" disabled>保存 .user.js</button></div></div><div class="meta"><span class="tag">版本 <b>2.4.0</b></span><span class="tag">修复 <b>2404</b></span><span class="tag">行数 <b id="lines">读取中</b></span><span class="tag">大小 <b id="size">读取中</b></span></div><section class="panel"><div class="bar"><strong>完整 Userscript</strong><span class="status" id="status">正在载入静态脚本数据…</span></div><textarea id="code" readonly spellcheck="false">正在载入…</textarea></section><div class="features"><b>本次修复：</b>页面代码中不再调用 <code>fetch()</code> 或 <code>XMLHttpRequest</code>。如果你仍看到“Failed to fetch”，说明浏览器看到的仍然是旧页面，而不是 Fix 2404。</div></main>
<script src="./payload-v240.js?v=2404"></script>
<script>
const code=document.getElementById('code'),statusEl=document.getElementById('status'),copy=document.getElementById('copy'),select=document.getElementById('select'),save=document.getElementById('save');let scriptText='';
async function load(){try{const parts=window.__QDR_PAYLOAD_V240;if(!Array.isArray(parts)||parts.length!==8)throw new Error('静态 payload-v240.js 未正确加载');if(typeof DecompressionStream!=='function')throw new Error('浏览器不支持 DecompressionStream');const chunks=[];let total=0;for(const part of parts){const raw=atob(part);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);chunks.push(bytes);total+=bytes.length}const all=new Uint8Array(total);let offset=0;for(const chunk of chunks){all.set(chunk,offset);offset+=chunk.length}const stream=new Blob([all]).stream().pipeThrough(new DecompressionStream('gzip'));scriptText=await new Response(stream).text();if(!scriptText.startsWith('// ==UserScript==')||!scriptText.includes('// @version      2.4.0'))throw new Error('Userscript 校验失败');code.value=scriptText;document.getElementById('lines').textContent=scriptText.split('\n').length.toLocaleString();document.getElementById('size').textContent=(new Blob([scriptText]).size/1024).toFixed(1)+' KB';statusEl.textContent='V2.4.0 代码已就绪 · Fix 2404';statusEl.className='status ok';copy.disabled=select.disabled=save.disabled=false}catch(e){console.error(e);code.value='脚本读取失败：'+e.message;statusEl.textContent='读取失败 · Fix 2404';statusEl.className='status err'}}
copy.onclick=async()=>{if(!scriptText)return;try{await navigator.clipboard.writeText(scriptText)}catch(_){code.focus();code.select();document.execCommand('copy')}copy.textContent='已复制';setTimeout(()=>copy.textContent='复制全部代码',1400)};select.onclick=()=>{code.focus();code.select()};save.onclick=()=>{if(!scriptText)return;const u=URL.createObjectURL(new Blob([scriptText],{type:'text/javascript;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='universal_qidian_reader_v2.4.0.user.js';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)};load();
</script></body></html>
