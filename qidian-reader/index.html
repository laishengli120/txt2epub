async function decodeScript(){
  const raw=atob(SCRIPT_GZIP_BASE64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('当前浏览器不支持解压，请使用最新版 Chrome/Edge/Safari');
  const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);return await new Response(stream).text();
}
let scriptText='';
const code=document.getElementById('code'),status=document.getElementById('status');
decodeScript().then(text=>{scriptText=text;code.value=text;document.getElementById('lines').textContent=text.split('\n').length.toLocaleString();document.getElementById('size').textContent=(new Blob([text]).size/1024).toFixed(1)+' KB';status.textContent='脚本已就绪';status.className='status ok'}).catch(err=>{code.value='脚本还原失败：'+err.message;status.textContent='读取失败';status.className='status err'});
document.getElementById('copyBtn').onclick=async()=>{if(!scriptText)return;try{await navigator.clipboard.writeText(scriptText);status.textContent='已复制全部代码到剪贴板';status.className='status ok'}catch{code.focus();code.select();document.execCommand('copy');status.textContent='已复制全部代码到剪贴板';status.className='status ok'}};
document.getElementById('selectBtn').onclick=()=>{code.focus();code.select();status.textContent='已全选代码'};
document.getElementById('saveBtn').onclick=()=>{if(!scriptText)return;const blob=new Blob([scriptText],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='universal_qidian_reader_v21.user.js';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);status.textContent='已生成 .user.js 文件';status.className='status ok'};
